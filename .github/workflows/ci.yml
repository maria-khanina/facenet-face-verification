name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch==2.14.0 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Style
        run: pycodestyle --max-line-length=88 face_verification scripts tests tools
      - name: Project rules
        run: python tools/rules_check.py .
      - name: Types
        run: pyright
      - name: Tests
        run: pytest -q
